# claude-art.thomlex.com: the static site (site/build.py), published by site/publish.py into /var/www/claude-art.
# `certbot --nginx -d claude-art.thomlex.com` adds the HTTPS server block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name claude-art.thomlex.com;

    root /var/www/claude-art;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
    # a look, a painting image or the stylesheet: cache them
    location ~* \.(jpg|jpeg|png|webp|css)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    # the studio's data changes every minute while a painter works
    location ~* \.json$ {
        add_header Cache-Control "no-store";
    }
    gzip on;
    gzip_types text/css application/json application/javascript;
}
